name: tests

# Runs `swift build` then `swift test`.
#
# Filed as part of the fleet-wide CI gap recorded in ecosystem#40: 12 of the 14
# repos in the OCCT stack carried a full test suite that no CI job ever executed,
# so a failing test produced a green tick. That is not hypothetical. Five
# assertions in OCCTSwiftAIS sat broken for nine days (OCCTSwiftAIS#46) because
# nothing in its pipeline ever compiled a test target.
#
# `swift build` and `swift test` are separate steps on purpose, so a compile
# failure and a test failure are distinguishable at a glance. Note that
# `swift build` alone is a weaker signal than it looks: it does not compile test
# targets at all. OCCTSwiftIO built clean with zero errors while carrying three
# real breaks in its test target during the OCCTSwift v3.0.0 repin.
#
# Blocking, not `continue-on-error`: a red here is meant to stop a merge, the same
# reasoning already written into OCCTSwiftScripts' tests.yml.
#
# macOS-only: the OCCTSwift dependency ships as a macOS xcframework, the same
# reasoning OCCTSwiftScripts' own tests.yml uses.
#
# Baseline at merge was 314 tests across 27 suites, of which 5 failed (OCCTSwiftAIS#46,
# inherited from before the merge). Green since OCCTSwiftInteraction#1 settled face
# identity on `IsSame` and rewrote the stale half of that test: 314 tests, 0 failures.

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.*'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.*'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

# One run per workflow per pull request (or per branch, for a push): a new commit cancels the
# queued or running job for the commit it replaces, so a busy branch does not stack up runs for
# commits nobody will merge. Runs on main are grouped by commit instead, so none is cancelled
# or replaced (a shared group would still drop a queued run when a third arrives) and every
# commit that lands there keeps a full result. `push` is limited to main because a pull request
# already gets a `pull_request` run for the same commit, and running both doubled the macOS
# queue. A branch with no pull request open gets no automatic run; use workflow_dispatch if one
# is wanted.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha
    || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: swift build
        run: swift build

      - name: swift test
        run: swift test
